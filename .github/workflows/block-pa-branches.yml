name: Block merges from personal branches

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - 'Stage*'
      - 'dep.*'

jobs:
  block:
    name: Block PA heads
    runs-on: ubuntu-latest
    steps:
      - name: Enforce policy
        shell: bash
        run: |
          echo "Head: $GITHUB_HEAD_REF | Base: $GITHUB_BASE_REF"
          if [[ "${GITHUB_HEAD_REF}" == PA.* ]]; then
            echo "::error title=Blocked::Pull requests from personal activities branches are not allowed."
            exit 1
          fi
          echo "All checks passed."