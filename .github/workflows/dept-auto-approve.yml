name: Auto Approve PRs for Department Leads

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    steps:
      - name: Get the branch name and PR author
        id: get_info
        run: |
          echo "Branch name: ${{ github.head_ref }}"
          echo "PR author: ${{ github.actor }}"
          BRANCH="${{ github.head_ref }}"
          AUTHOR="${{ github.actor }}"
          
          # Extract the department from the branch name
          DEPARTMENT=$(echo "$BRANCH" | cut -d'.' -f2)  # Get department from branch name
          echo "Department: $DEPARTMENT"
          
          # Set department code owners based on the branch
          if [[ "$BRANCH" == temp.TM-01.* ]]; then
            CODE_OWNER="Ozia112"
          elif [[ "$BRANCH" == temp.TM-02.* ]]; then
            CODE_OWNER="Fabio0302"
          elif [[ "$BRANCH" == temp.TM-03.* ]]; then
            CODE_OWNER="LicNico"
          elif [[ "$BRANCH" == temp.TM-05.* ]]; then
            CODE_OWNER="MaximilianoCarrilloAlvarado"
          elif [[ "$BRANCH" == temp.TM-06.* ]]; then
            CODE_OWNER="Wimon77"
          fi
          
          echo "Code owner for temp branch: $CODE_OWNER"
          echo "::set-output name=code_owner::$CODE_OWNER"
          echo "::set-output name=department::$DEPARTMENT"

      - name: Validate if PR author is the code owner of temp branch
        id: validate_owner
        run: |
          if [[ "${{ steps.get_info.outputs.code_owner }}" != "${{ github.actor }}" ]]; then
            echo "❌ El autor del PR no es el propietario del código de la rama temporal."
            exit 1
          fi
          echo "✔️ El autor es el propietario del código de la rama temporal."

      - name: Check if PR author is department lead
        id: check_lead
        run: |
          DEPARTMENT="${{ steps.get_info.outputs.department }}"
          AUTHOR="${{ github.actor }}"
          
          # Check if the PR author is the department lead for the respective department
          if [[ "$DEPARTMENT" == "Process" && "$AUTHOR" == "Ozia112" ]]; then
            echo "Lead is Process lead. Auto-approving PR."
            echo "::set-output name=approved::true"
          elif [[ "$DEPARTMENT" == "Product" && "$AUTHOR" == "Fabio0302" ]]; then
            echo "Lead is Product lead. Auto-approving PR."
            echo "::set-output name=approved::true"
          elif [[ "$DEPARTMENT" == "Design" && "$AUTHOR" == "Wimon77" ]]; then
            echo "Lead is Design lead. Auto-approving PR."
            echo "::set-output name=approved::true"
          elif [[ "$DEPARTMENT" == "Presentation" && "$AUTHOR" == "LicNico" ]]; then
            echo "Lead is Presentation lead. Auto-approving PR."
            echo "::set-output name=approved::true"
          elif [[ "$DEPARTMENT" == "Requirements" && "$AUTHOR" == "MaximilianoCarrilloAlvarado" ]]; then
            echo "Lead is Requirements lead. Auto-approving PR."
            echo "::set-output name=approved::true"
          else
            echo "No approval for PR."
            echo "::set-output name=approved::false"
          fi

      - name: Check if department code owner matches
        id: check_department_owner
        run: |
          DEPARTMENT="${{ steps.get_info.outputs.department }}"
          CODE_OWNER="${{ steps.get_info.outputs.code_owner }}"

          # Assign department code owners
          if [[ "$DEPARTMENT" == "Process" && "$CODE_OWNER" == "Ozia112" ]]; then
            echo "Department code owner matches. Auto-approving PR."
            echo "::set-output name=approved::true"
          elif [[ "$DEPARTMENT" == "Product" && "$CODE_OWNER" == "Fabio0302" ]]; then
            echo "Department code owner matches. Auto-approving PR."
            echo "::set-output name=approved::true"
          elif [[ "$DEPARTMENT" == "Design" && "$CODE_OWNER" == "Wimon77" ]]; then
            echo "Department code owner matches. Auto-approving PR."
            echo "::set-output name=approved::true"
          elif [[ "$DEPARTMENT" == "Presentation" && "$CODE_OWNER" == "LicNico" ]]; then
            echo "Department code owner matches. Auto-approving PR."
            echo "::set-output name=approved::true"
          elif [[ "$DEPARTMENT" == "Requirements" && "$CODE_OWNER" == "MaximilianoCarrilloAlvarado" ]]; then
            echo "Department code owner matches. Auto-approving PR."
            echo "::set-output name=approved::true"
          else
            echo "Department code owner does not match. Approval required."
            echo "::set-output name=approved::false"
          fi

      - name: Auto-approve if department code owner matches
        if: steps.check_department_owner.outputs.approved == 'true'
        uses: hmarr/auto-approve-action@v3
        with:
          github-token: ${{ secrets.BOT_TOKEN }}

      - name: Fail if department code owner does not match
        if: steps.check_department_owner.outputs.approved == 'false'
        run: |
          echo "❌ El propietario del código de la rama no coincide con el propietario del departamento."
          echo "Se requiere aprobación adicional."
          exit 1